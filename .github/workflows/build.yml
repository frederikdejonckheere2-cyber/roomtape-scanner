name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -n 40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: roomtape-scanner-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the app as a download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk roomtape-scanner.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest roomtape-scanner.apk --title "Roomtape Scanner" --notes "Open this page on your Android phone and tap roomtape-scanner.apk to install."

      - name: Keep a copy on the apk branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/out && cp roomtape-scanner.apk /tmp/out/ && cd /tmp/out
          git init -q -b apk && git add roomtape-scanner.apk
          git -c user.name="build" -c user.email="build@users.noreply.github.com" commit -q -m "App build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
