<title>Roomtape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a surveyor's notebook. Cool drafting paper, ink-blue lines, tape-measure yellow for every number you measured. One-column app with a fixed bottom tab bar. */
:root{
  --paper:#eef1f4; --surface:#ffffff; --ink:#17223a; --muted:#5a6578; --line:#d2d8e1;
  --tape:#f2b705; --tape-ink:#2b2200; --blue:#2c56cf; --blue-soft:#e3e9fb;
  --ok:#1f8a4c; --warn:#b4540a; --bad:#b42318;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e1421; --surface:#161f31; --ink:#e6ebf3; --muted:#97a2b6; --line:#2a3449;
  --tape:#f2b705; --tape-ink:#2b2200; --blue:#86a2ff; --blue-soft:#1d2945;
  --ok:#4cc47f; --warn:#f0a050; --bad:#ff7b6e; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0e1421; --surface:#161f31; --ink:#e6ebf3; --muted:#97a2b6; --line:#2a3449;
  --tape:#f2b705; --tape-ink:#2b2200; --blue:#86a2ff; --blue-soft:#1d2945;
  --ok:#4cc47f; --warn:#f0a050; --bad:#ff7b6e; color-scheme:dark }
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.08rem;font-weight:600}
p{margin:0}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{font-family:var(--display);font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:8px}
.tape-mark{width:26px;height:14px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 5px) bottom/100% 5px no-repeat,var(--tape)}
.homeinfo{font-size:.82rem;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save{font-size:.75rem;color:var(--muted);font-family:var(--mono)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tapeval{font-family:var(--mono);background:var(--tape);color:var(--tape-ink);padding:1px 6px;border-radius:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:500}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
button.tape{background:var(--tape);color:var(--tape-ink);border-color:var(--tape);font-weight:600}
button.ghost{background:transparent}
button.link{border:none;background:none;color:var(--blue);padding:4px;text-decoration:underline}
button:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:999px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--ink)}
.dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px}
.dirs button{padding:12px 6px;font-size:.88rem}
.dirs .center{display:flex;align-items:center;justify-content:center;font-size:.78rem;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:8px;padding:6px}
.banner{max-width:760px;margin:0 auto 16px;background:var(--blue-soft);border:1px solid var(--blue);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.banner p{flex:1;min-width:200px}
.steps{display:flex;gap:6px}
.steps span{height:4px;flex:1;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--tape)}
.measure-canvas{width:100%;max-width:100%;border-radius:8px;border:1px solid var(--line);touch-action:manipulation;display:block;background:var(--paper)}
.hint{font-size:.85rem;color:var(--muted);border-left:3px solid var(--tape);padding-left:10px}
.floorhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.plan-box{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:8px;background-color:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20px 20px;background-position:-1px -1px}
.plan-box svg{display:block;touch-action:none}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.tbl{overflow-x:auto}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--blue-soft)}
.three-wrap{position:relative;width:100%;height:min(62vh,560px);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface);touch-action:none}
.three-wrap canvas{display:block;width:100%;height:100%}
.three-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;color:var(--muted)}
.sel-card{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sel-card .info{flex:1;min-width:180px}
.swatch{width:14px;height:14px;border-radius:3px;display:inline-block;vertical-align:-2px;border:1px solid var(--line)}
.status{font-size:.88rem;padding:10px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
.status.err{border-color:var(--bad);color:var(--bad)}
.status.ok{border-color:var(--ok)}
.budget-bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.budget-bar i{display:block;height:100%;background:var(--tape)}
.pill{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.shopgroup{display:flex;flex-direction:column;gap:6px}
.item-line{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.item-line .n{min-width:0;flex:1}
.item-line a{color:var(--blue);font-size:.82rem}
.radios{display:flex;flex-direction:column;gap:8px}
.radios label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.radios input{width:auto}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;color:var(--muted);padding:6px 2px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabs button[aria-current="true"]{color:var(--ink);font-weight:600}
.tabs button[aria-current="true"] svg{stroke:var(--blue)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,15,25,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.overlay .panel{width:100%;max-width:520px;max-height:85vh;overflow:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="brand"><span class="tape-mark" aria-hidden="true"></span>Roomtape</div>
  <div class="homeinfo" id="homeInfo"></div>
  <span class="save" id="saveState"></span>
</header>
<div class="banner" id="exampleBanner" hidden>
  <p>You are looking at an example home. Scan your own rooms when you are ready.</p>
  <button class="primary" id="btnNewHome">Start my own home</button>
</div>

<main>
  <section id="v-scan" class="wrap"></section>
  <section id="v-plan" class="wrap" hidden></section>
  <section id="v-3d" class="wrap" hidden>
    <div class="floorhead">
      <h2>3D view</h2>
      <div class="chips" id="floorChips3d"></div>
    </div>
    <div class="three-wrap" id="threeWrap"><div class="three-msg" id="threeMsg">Loading 3D…</div></div>
    <div class="row small muted">
      <span>Drag a piece of furniture to move it. Drag empty space to turn the view, pinch or scroll to zoom.</span>
      <button class="ghost" id="btnWalls">Walls: low</button>
    </div>
    <div class="panel" id="selPanel" hidden></div>
    <div class="row"><button class="tape" id="btnGoFurnish">Add furniture</button></div>
  </section>
  <section id="v-furnish" class="wrap" hidden></section>
</main>

<nav class="tabs" aria-label="Sections">
  <button data-view="scan"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3.2"/></svg>Scan</button>
  <button data-view="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17"/><path d="M3.5 12h7v8.5M10.5 3.5V8M14 12h6.5"/></svg>Floor plans</button>
  <button data-view="3d"><svg viewBox="0 0 24 24"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>3D</button>
  <button data-view="furnish"><svg viewBox="0 0 24 24"><path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6M3 15h18M5 10V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3M5 18v2M19 18v2"/></svg>Furnish</button>
</nav>
<div class="overlay" id="overlay" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const m2 = v => (Math.round(v * 100) / 100).toFixed(2);
const eur = v => '€' + Math.round(v).toLocaleString('nl-BE');
const ROOM_COLORS = ['#2c56cf','#1f8a4c','#b4540a','#8a3fb8','#0e8a8a','#c2366b','#6b7d1f','#4a6fa5'];
const ROOM_NAMES = ['Living room','Kitchen','Bedroom','Bathroom','Hall','Toilet','Office','Dining room','Laundry','Garage','Attic','Kids room'];
const TYPES = ['bed','sofa','chair','table','desk','wardrobe','cabinet','shelf','tv','lamp','rug','plant','other'];
const FLOOR_H = 3.0;

/* ---------- data ---------- */
function exampleHome() {
  const g = 'f0', u = 'f1';
  const P = { example: true, name: 'Example house', country: 'Belgium',
    floors: [{ id: g, name: 'Ground floor', level: 0 }, { id: u, name: 'First floor', level: 1 }],
    rooms: [
      { id: 'r1', name: 'Living room', floorId: g, w: 5.2, d: 4.1, h: 2.6, x: 0, z: 0, color: ROOM_COLORS[0] },
      { id: 'r2', name: 'Kitchen', floorId: g, w: 3.4, d: 4.1, h: 2.6, x: 5.2, z: 0, color: ROOM_COLORS[1] },
      { id: 'r3', name: 'Hall', floorId: g, w: 2.2, d: 3.0, h: 2.6, x: 0, z: 4.1, color: ROOM_COLORS[2] },
      { id: 'r4', name: 'Bedroom', floorId: u, w: 4.0, d: 3.6, h: 2.5, x: 0, z: 0, color: ROOM_COLORS[3] },
      { id: 'r5', name: 'Bathroom', floorId: u, w: 2.6, d: 2.2, h: 2.5, x: 4.0, z: 0, color: ROOM_COLORS[4] },
    ],
    items: [
      { id: 'i1', roomId: 'r1', name: 'Three-seat sofa (example)', shop: 'Example shop', price: 699, w: 2.2, d: 0.9, h: 0.85, type: 'sofa', color: '#5a6b7e', x: 2.6, z: 3.4, rot: 0 },
      { id: 'i2', roomId: 'r1', name: 'Coffee table (example)', shop: 'Example shop', price: 129, w: 1.1, d: 0.6, h: 0.42, type: 'table', color: '#a77b4f', x: 2.6, z: 2.2, rot: 0 },
      { id: 'i3', roomId: 'r4', name: 'Double bed 160×200 (example)', shop: 'Example shop', price: 349, w: 1.68, d: 2.1, h: 0.95, type: 'bed', color: '#d8cfc2', x: 2.0, z: 1.15, rot: 0 },
    ] };
  return P;
}
function emptyHome() {
  return { example: false, name: 'My home', country: 'Belgium', floors: [{ id: uid(), name: 'Ground floor', level: 0 }], rooms: [], items: [] };
}
let P = null;
try { const s = localStorage.getItem('roomtape.home'); if (s) P = JSON.parse(s); } catch (e) {}
if (!P || !P.floors) P = exampleHome();

/* ---------- persistence ---------- */
let docRef = null, saveTimer = null;
function setSave(t) { $('#saveState').textContent = t; }
function save() {
  try { localStorage.setItem('roomtape.home', JSON.stringify(P)); } catch (e) {}
  if (!docRef) { setSave('saved on this device'); return; }
  setSave('saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await docRef.set({ json: JSON.stringify(P), updated: Date.now() }); setSave('saved'); }
    catch (e) { setSave('saved on this device only'); }
  }, 700);
}
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    docRef = db.collection('data/users/' + id).doc('home');
    const snap = await docRef.get();
    if (snap.exists) {
      const d = snap.data();
      const loaded = d && d.json ? JSON.parse(d.json) : null;
      if (loaded && loaded.floors) { P = loaded; renderAll(); }
    }
    setSave('synced');
  } catch (e) { docRef = null; }
})();

let sampleFn = null;
(async () => {
  try { if (window.claude && window.claude.use) sampleFn = await window.claude.use('sample'); } catch (e) {}
  if (view === 'furnish') renderFurnish();
})();

/* ---------- helpers ---------- */
const floorOf = id => P.floors.find(f => f.id === id);
const roomOf = id => P.rooms.find(r => r.id === id);
const floorsSorted = () => [...P.floors].sort((a, b) => b.level - a.level);
const roomsOn = fid => P.rooms.filter(r => r.floorId === fid);
const polyArea = pts => Math.abs(pts.reduce((s, p, i) => { const q = pts[(i + 1) % pts.length]; return s + p[0] * q[1] - q[0] * p[1]; }, 0)) / 2;
const area = r => r.poly && r.poly.length > 2 ? polyArea(r.poly) : r.w * r.d;
function floorName(level) {
  if (level === 0) return 'Ground floor';
  if (level < 0) return level === -1 ? 'Basement' : 'Basement ' + (-level);
  return ['First', 'Second', 'Third', 'Fourth', 'Fifth'][level - 1] ? ['First', 'Second', 'Third', 'Fourth', 'Fifth'][level - 1] + ' floor' : 'Floor ' + level;
}
function renderHeader() {
  const n = P.rooms.length, a = P.rooms.reduce((s, r) => s + area(r), 0);
  $('#homeInfo').textContent = `${P.name} · ${P.floors.length} floor${P.floors.length > 1 ? 's' : ''} · ${n} room${n !== 1 ? 's' : ''} · ${a.toFixed(1)} m²`;
  $('#exampleBanner').hidden = !P.example;
}
let newHomeArmed = false;
$('#btnNewHome').addEventListener('click', e => {
  if (!newHomeArmed) { newHomeArmed = true; e.target.textContent = 'Tap again to clear the example'; return; }
  P = emptyHome(); newHomeArmed = false; e.target.textContent = 'Start my own home';
  wiz = null; save(); setView('scan'); renderAll();
});

/* ---------- navigation ---------- */
let view = 'scan';
function setView(v) {
  view = v;
  for (const id of ['scan', 'plan', '3d', 'furnish']) $('#v-' + id).hidden = id !== v;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.view === v ? 'true' : 'false'));
  if (v === 'scan') renderScan();
  if (v === 'plan') renderPlan();
  if (v === '3d') open3D(); else stop3D();
  if (v === 'furnish') renderFurnish();
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
function renderAll() { renderHeader(); setView(view); }

/* ================= SCAN WIZARD ================= */
let wiz = null; // {step, room, measure}
function startWizard() {
  if (P.example) { P = emptyHome(); renderHeader(); }
  const lastRoom = P.rooms[P.rooms.length - 1];
  wiz = { step: 0, room: { id: uid(), name: '', floorId: lastRoom ? lastRoom.floorId : P.floors[0].id, w: '', d: '', h: 2.5, color: ROOM_COLORS[P.rooms.length % ROOM_COLORS.length] }, measure: null, pos: null };
}
function renderScan() {
  const el = $('#v-scan');
  if (!wiz) {
    el.innerHTML = `
      <div><p class="label">Measure your home</p><h2>Scan one room at a time</h2></div>
      <div class="panel">
        <p>For each room you take a photo of each wall with something of a known size against it, like an A4 sheet or a door. Tap both ends of that object and both ends of the wall, and Roomtape works out the length. You can also type a size if you already know it.</p>
        <p class="hint">After every room the app asks if there is another room to scan. Then you say where the new room sits: left, right, in front of or behind a room you already have, or on another floor.</p>
        <div class="row"><button class="tape" id="btnStart">${P.rooms.length ? 'Scan another room' : 'Scan my first room'}</button>
        ${P.rooms.length ? '<button id="btnSeePlan">See my floor plans</button>' : ''}</div>
      </div>
      <div class="panel">
        <h3>Import a scan from the Android app</h3>
        <p class="small muted">Scanned your home with Roomtape Scanner on your phone? Pick the scan file you saved, or paste the scan you copied. Rooms keep their real shape and their position from the walk.</p>
        <div class="row"><button class="primary" id="btnImportFile">Choose scan file</button><input type="file" id="importFile" accept=".json,application/json,text/plain" hidden></div>
        <label class="f"><span class="label">Or paste the scan here</span><textarea id="importText" placeholder='{"format":"roomtape-scan", …}'></textarea></label>
        <div class="row"><button id="btnImportText">Import pasted scan</button></div>
        <div class="status err" id="importErr" hidden></div>
      </div>
      ${P.rooms.length ? `<div class="panel"><h3>Rooms so far</h3>${floorsSorted().map(f => roomsOn(f.id).length ? `<div><p class="label">${esc(f.name)}</p>${roomsOn(f.id).map(r => `<div class="item-line"><span class="n">${esc(r.name)}</span><span class="num small">${m2(r.w)} × ${m2(r.d)} m · ${area(r).toFixed(1)} m²</span></div>`).join('')}</div>` : '').join('')}</div>` : ''}`;
    $('#btnStart').onclick = () => { startWizard(); renderScan(); };
    $('#btnImportFile').onclick = () => $('#importFile').click();
    $('#importFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => runImport(String(rd.result)); rd.readAsText(f); };
    $('#btnImportText').onclick = () => runImport($('#importText').value);
    if ($('#btnSeePlan')) $('#btnSeePlan').onclick = () => setView('plan');
    return;
  }
  const R = wiz.room;
  const stepsBar = `<div class="steps">${[0, 1, 2, 3].map(i => `<span class="${i <= wiz.step ? 'on' : ''}"></span>`).join('')}</div>`;
  if (wiz.measure) return renderMeasure(el);

  if (wiz.step === 0) {
    el.innerHTML = `${stepsBar}
      <div><p class="label">Step 1 of 4</p><h2>Which room is this?</h2></div>
      <div class="panel">
        <label class="f"><span class="label">Room name</span><input id="rName" value="${esc(R.name)}" placeholder="e.g. Living room"></label>
        <div class="chips">${ROOM_NAMES.map(n => `<button class="chip" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>

      <div><p class="label">Step 2 of 4 · ${esc(R.name)}</p><h2>Measure the room</h2></div>

      <div class="row"><button class="ghost" id="back">Back</button><button class="tape" id="next">Next: position</button></div>
      <div class="status err" id="err" hidden></div>`;
    const sync = () => { for (const k of ['w', 'd', 'h']) R[k] = $('#in_' + k).value.replace(',', '.'); };
    el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { sync(); wiz.measure = { target: b.dataset.m, img: null, pts: [], ref: 'a4l', custom: '' }; renderScan(); });
    $('#back').onclick = () => { sync(); wiz.step = 0; renderScan(); };
    $('#next').onclick = () => {
      sync();
      const w = parseFloat(R.w), d = parseFloat(R.d), h = parseFloat(R.h) || 2.5;
      if (!(w > 0.3 && w < 60 && d > 0.3 && d < 60)) { $('#err').hidden = false; $('#err').textContent = 'Width and length must be between 0.3 m and 60 m. Measure them or type them in.'; return; }
      R.w = w; R.d = d; R.h = h;
      const others = roomsOn(R.floorId), otherFloors = P.rooms.filter(r => r.floorId !== R.floorId);
      if (!others.length && !otherFloors.length) { R.x = 0; R.z = 0; finishRoom(); return; }
      wiz.step = 2; renderScan();
    };
    return;
  }
  if (wiz.step === 2) {
    const others = roomsOn(R.floorId);
    const fl = floorOf(R.floorId);
    if (others.length) {
      const refId = wiz.ref || others[others.length - 1].id;
      el.innerHTML = `${stepsBar}
        <div><p class="label">Step 3 of 4 · ${esc(R.name)}</p><h2>Where is this room?</h2></div>
        <div class="panel">

          <label class="f"><span class="label">Next to</span><select id="refRoom">${others.map(r => `<option value="${r.id}" ${r.id === refId ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select></label>
          <div class="dirs">
            <span></span><button data-dir="behind">Behind</button><span></span>
            <button data-dir="left">Left</button><div class="center" id="refName"></div><button data-dir="right">Right</button>
            <span></span><button data-dir="front">In front</button><span></span>

          <div class="row"><button class="ghost" id="back">Back</button></div>

      $('#refRoom').onchange = () => { wiz.ref = $('#refRoom').value; upd(); }; upd();

    } else {
      const otherRooms = P.rooms.filter(r => r.floorId !== R.floorId);
      el.innerHTML = `${stepsBar}
        <div><p class="label">Step 3 of 4 · ${esc(R.name)}</p><h2>First room on ${esc(fl.name)}</h2></div>
        <div class="panel">
          <p class="small muted">Which room is directly above or below it? Roomtape lines the floors up from there.</p>
          <label class="f"><span class="label">Lines up with</span><select id="stackRef">${otherRooms.map(r => `<option value="${r.id}">${esc(r.name)} (${esc(floorOf(r.floorId).name)})</option>`).join('')}<option value="">None, start at the corner</option></select></label>
          <div class="row"><button class="ghost" id="back">Back</button><button class="tape" id="ok">Place room</button></div>
        </div>`;
      $('#back').onclick = () => { wiz.step = 1; renderScan(); };
      $('#ok').onclick = () => { const ref = roomOf($('#stackRef').value); R.x = ref ? ref.x : 0; R.z = ref ? ref.z : 0; finishRoom(); };
    }
    return;
  }
  if (wiz.step === 3) {
    el.innerHTML = `${stepsBar}
      <div><p class="label">Step 4 of 4</p><h2>${esc(R.name)} is saved</h2></div>
      <div class="panel">
        <p><span class="tapeval">${m2(R.w)} × ${m2(R.d)} m</span> · ceiling ${m2(R.h)} m · ${area(R).toFixed(1)} m² on ${esc(floorOf(R.floorId).name)}</p>
        <h3>Is there another room to scan?</h3>
        <div class="row"><button class="tape" id="yes">Yes, scan another room</button><button class="primary" id="no">No, show all my rooms</button></div>
      </div>`;
    $('#yes').onclick = () => { startWizard(); renderScan(); };
    $('#no').onclick = () => { wiz = null; setView('plan'); };
  }
}
function placeRelative(R, ref, dir) {
  if (dir === 'right') { R.x = ref.x + ref.w; R.z = ref.z; }
  if (dir === 'left') { R.x = ref.x - R.w; R.z = ref.z; }
  if (dir === 'behind') { R.x = ref.x; R.z = ref.z - R.d; }
  if (dir === 'front') { R.x = ref.x; R.z = ref.z + ref.d; }
}
function finishRoom() {
  P.rooms.push(wiz.room); wiz.step = 3; save(); renderHeader(); renderScan();
}

/* ---------- photo measuring ---------- */
const REFS = { a4l: ['A4 sheet, long side', 29.7], a4s: ['A4 sheet, short side', 21.0], card: ['Bank card, long side', 8.56], door: ['Interior door, height', 201.5], doorw: ['Interior door, width', 83], tile: ['Floor tile (enter size)', 0], custom: ['Something else (enter size)', 0] };
function renderMeasure(el) {
  const M = wiz.measure, R = wiz.room;
  const tLabel = { w: 'width', d: 'length', h: 'ceiling height' }[M.target];
  const refLen = REFS[M.ref][1] || parseFloat(String(M.custom).replace(',', '.')) || 0;
  const n = M.pts.length;
  const instr = !M.img ? 'Take a photo of the wall, straight on, with the reference object flat against it.'
    : n < 2 ? `Tap ${n ? 'the other end' : 'one end'} of the reference object.`
    : n < 4 ? `Tap ${n === 2 ? 'one end' : 'the other end'} of the wall (${tLabel}).` : 'Done. Check the result below.';
  let result = null;
  if (n === 4 && refLen > 0) { const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y); result = refLen * d(M.pts[2], M.pts[3]) / d(M.pts[0], M.pts[1]) / 100; }
  el.innerHTML = `
    <div><p class="label">${esc(R.name)} · measuring ${tLabel}</p><h2>${esc(instr)}</h2></div>
    <div class="panel">
      <label class="f"><span class="label">Reference object in the photo</span>
        <select id="refSel">${Object.entries(REFS).map(([k, v]) => `<option value="${k}" ${k === M.ref ? 'selected' : ''}>${v[0]}${v[1] ? ' · ' + v[1] + ' cm' : ''}</option>`).join('')}</select></label>
      ${!REFS[M.ref][1] ? `<label class="f"><span class="label">Its real length in cm</span><input id="customLen" inputmode="decimal" value="${esc(M.custom)}" placeholder="e.g. 60"></label>` : ''}
      <div class="row"><button class="tape" id="btnPhoto">${M.img ? 'Retake photo' : 'Open camera'}</button>
      <input type="file" id="photoIn" accept="image/*" capture="environment" hidden></div>
      ${M.img ? `<canvas id="mc" class="measure-canvas"></canvas>
        <div class="row small"><span class="swatch" style="background:var(--blue)"></span>reference <span class="swatch" style="background:var(--tape)"></span>wall
        <button class="link" id="undoPt">Undo last tap</button><button class="link" id="resetPt">Start over</button></div>` : ''}
      ${result ? `<div class="status ok">Measured ${tLabel}: <span class="tapeval">${m2(result)} m</span></div>` : ''}
      <p class="hint">For a good result: stand back so the whole wall fits, hold the phone level and square to the wall, and keep the reference at roughly the same distance as the wall. Expect a few centimetres of error. A laser meter is still more exact.</p>
      <div class="row"><button class="ghost" id="mBack">Cancel</button>${result ? `<button class="primary" id="useIt">Use ${m2(result)} m</button>` : ''}</div>
    </div>`;
  $('#refSel').onchange = e => { M.ref = e.target.value; renderScan(); };
  if ($('#customLen')) $('#customLen').onchange = e => { M.custom = e.target.value; renderScan(); };
  $('#btnPhoto').onclick = () => $('#photoIn').click();
  $('#photoIn').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(); img.onload = () => { M.img = img; M.pts = []; renderScan(); };
    img.src = URL.createObjectURL(f);
  };
  $('#mBack').onclick = () => { wiz.measure = null; renderScan(); };
  if ($('#useIt')) $('#useIt').onclick = () => { R[M.target] = +result.toFixed(2); wiz.measure = null; renderScan(); };
  if ($('#undoPt')) $('#undoPt').onclick = () => { M.pts.pop(); renderScan(); };
  if ($('#resetPt')) $('#resetPt').onclick = () => { M.pts = []; renderScan(); };
  if (M.img) drawMeasure();
}
function drawMeasure() {
  const M = wiz.measure, c = $('#mc'), img = M.img;
  const sc = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
  const cs = getComputedStyle(document.documentElement);
  const blue = cs.getPropertyValue('--blue').trim() || '#2c56cf', tape = cs.getPropertyValue('--tape').trim() || '#f2b705';
  const lw = Math.max(3, c.width / 250);
  M.pts.forEach((p, i) => {
    const col = i < 2 ? blue : tape;
    x.fillStyle = col; x.strokeStyle = '#000'; x.lineWidth = lw / 2;
    x.beginPath(); x.arc(p.x, p.y, lw * 2.2, 0, Math.PI * 2); x.fill(); x.stroke();
    if (i % 2 === 1) { const a = M.pts[i - 1]; x.strokeStyle = col; x.lineWidth = lw; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(p.x, p.y); x.stroke(); }
  });
  c.onclick = e => {
    if (M.pts.length >= 4) return;
    const r = c.getBoundingClientRect();
    M.pts.push({ x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height });
    renderScan();
  };
}

/* ================= FLOOR PLANS ================= */
function renderPlan() {
  const el = $('#v-plan');
  if (!P.rooms.length) {
    el.innerHTML = `<div><p class="label">Overview</p><h2>No rooms yet</h2></div><div class="panel"><p>Scan your first room and it shows up here, floor by floor, with all its measurements.</p><div class="row"><button class="tape" id="go">Scan a room</button></div></div>`;
    $('#go').onclick = () => { startWizard(); setView('scan'); }; return;
  }
  const total = P.rooms.reduce((s, r) => s + area(r), 0);
  el.innerHTML = `<div class="floorhead"><div><p class="label">Overview · floor by floor</p><h2>${esc(P.name)}</h2></div>
      <span class="tapeval">${total.toFixed(1)} m² total</span></div>
    <label class="f" style="max-width:320px"><span class="label">Name of this home</span><input id="homeName" value="${esc(P.name)}"></label>
    <p class="small muted">Drag a room to fine-tune where it sits. Tap a room in the list to change its size, name or floor.</p>
    ${floorsSorted().map(f => {
      const rs = roomsOn(f.id); const a = rs.reduce((s, r) => s + area(r), 0);
      return `<div class="panel">
        <div class="floorhead"><h3>${esc(f.name)}</h3><span class="num small muted">${rs.length} room${rs.length !== 1 ? 's' : ''} · ${a.toFixed(1)} m²</span></div>
        ${rs.length ? `<div class="plan-box" data-floor="${f.id}"></div>
        <div class="tbl"><table><thead><tr><th>Room</th><th class="r">Width</th><th class="r">Length</th><th class="r">Height</th><th class="r">Area</th></tr></thead><tbody>
        ${rs.map(r => `<tr class="click" data-room="${r.id}"><td><span class="swatch" style="background:${r.color}"></span> ${esc(r.name)}</td><td class="r num">${m2(r.w)} m</td><td class="r num">${m2(r.d)} m</td><td class="r num">${m2(r.h)} m</td><td class="r num">${area(r).toFixed(1)} m²</td></tr>`).join('')}
        </tbody></table></div>` : `<p class="small muted">No rooms on this floor yet.</p>`}
      </div>`;
    }).join('')}
    <div class="row"><button class="tape" id="addRoom">Scan another room</button><button id="see3d">View in 3D</button></div>`;
  $('#homeName').onchange = e => { P.name = e.target.value.trim() || 'My home'; save(); renderHeader(); };
  $('#addRoom').onclick = () => { startWizard(); setView('scan'); };
  $('#see3d').onclick = () => setView('3d');
  el.querySelectorAll('[data-room]').forEach(tr => tr.onclick = () => editRoom(tr.dataset.room));
  el.querySelectorAll('.plan-box').forEach(drawPlan);
}
function drawPlan(box) {
  const fid = box.dataset.floor, rs = roomsOn(fid);
  const minX = Math.min(...rs.map(r => r.x)), minZ = Math.min(...rs.map(r => r.z));
  const maxX = Math.max(...rs.map(r => r.x + r.w)), maxZ = Math.max(...rs.map(r => r.z + r.d));
  const cw = Math.max(300, box.clientWidth || 340), pad = 28;
  const s = Math.min((cw - pad * 2) / Math.max(1, maxX - minX), 90);
  const W = (maxX - minX) * s + pad * 2, H = (maxZ - minZ) * s + pad * 2;
  const X = v => pad + (v - minX) * s, Z = v => pad + (v - minZ) * s;
  let svg = `<svg width="${Math.max(W, cw - 2)}" height="${H}" viewBox="0 0 ${Math.max(W, cw - 2)} ${H}" font-family="IBM Plex Mono, monospace">`;
  for (const r of rs) {
    const x = X(r.x), y = Z(r.z), w = r.w * s, h = r.d * s;
    svg += `<g data-drag="${r.id}" style="cursor:grab">
      ${r.poly && r.poly.length > 2
        ? `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="transparent"/><polygon points="${r.poly.map(p => `${x + p[0] * s},${y + p[1] * s}`).join(' ')}" fill="${r.color}" fill-opacity=".16" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>`
        : `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${r.color}" fill-opacity=".16" stroke="var(--ink)" stroke-width="2.5"/>`}`;
    // dimension ticks inside top and left edge
    if (w > 46) svg += `<line x1="${x + 6}" y1="${y + 9}" x2="${x + w - 6}" y2="${y + 9}" stroke="var(--muted)" stroke-width="1"/><line x1="${x + 6}" y1="${y + 5}" x2="${x + 6}" y2="${y + 13}" stroke="var(--muted)"/><line x1="${x + w - 6}" y1="${y + 5}" x2="${x + w - 6}" y2="${y + 13}" stroke="var(--muted)"/>
      <rect x="${x + w / 2 - 19}" y="${y + 3}" width="38" height="12" fill="var(--paper)"/><text x="${x + w / 2}" y="${y + 12.5}" font-size="10" text-anchor="middle" fill="var(--ink)">${m2(r.w)}</text>`;
    if (h > 46) svg += `<line x1="${x + 9}" y1="${y + 18}" x2="${x + 9}" y2="${y + h - 6}" stroke="var(--muted)" stroke-width="1"/><line x1="${x + 5}" y1="${y + h - 6}" x2="${x + 13}" y2="${y + h - 6}" stroke="var(--muted)"/>
      <g transform="translate(${x + 9},${y + h / 2 + 6}) rotate(-90)"><rect x="-19" y="-6" width="38" height="12" fill="var(--paper)"/><text x="0" y="3.5" font-size="10" text-anchor="middle" fill="var(--ink)">${m2(r.d)}</text></g>`;
    const fs = w > 90 ? 12 : 10;
    svg += `<text x="${x + w / 2 + 4}" y="${y + h / 2}" font-size="${fs}" text-anchor="middle" fill="var(--ink)" font-family="Familjen Grotesk, sans-serif" font-weight="700">${esc(w > 60 ? r.name : r.name.slice(0, 6))}</text>
      ${w > 60 ? `<text x="${x + w / 2 + 4}" y="${y + h / 2 + 15}" font-size="10" text-anchor="middle" fill="var(--muted)">${area(r).toFixed(1)} m²</text>` : ''}`;
    // furniture footprints
    for (const it of P.items.filter(i => i.roomId === r.id)) {
      const fw = (it.rot % 180 ? it.d : it.w) * s, fd = (it.rot % 180 ? it.w : it.d) * s;
      svg += `<rect x="${x + it.x * s - fw / 2}" y="${y + it.z * s - fd / 2}" width="${fw}" height="${fd}" fill="var(--muted)" fill-opacity=".25" stroke="var(--muted)" stroke-width="1" pointer-events="none"/>`;
    }
    svg += `</g>`;
  }
  svg += `</svg>`;
  box.innerHTML = svg.replace(/var\(--([\w-]+)\)/g, (m, n) => tok('--' + n) || '#888');
  box.querySelectorAll('[data-drag]').forEach(g => {
    g.addEventListener('pointerdown', e => {
      const r = roomOf(g.dataset.drag); const sx = e.clientX, sy = e.clientY, ox = r.x, oz = r.z; let moved = false;
      g.setPointerCapture(e.pointerId);
      const mv = ev => {
        const dx = (ev.clientX - sx) / s, dz = (ev.clientY - sy) / s;
        if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 4) moved = true;
        let nx = Math.round((ox + dx) * 20) / 20, nz = Math.round((oz + dz) * 20) / 20;
        for (const o of rs) if (o !== r) { // snap to neighbour edges
          for (const [a, b] of [[nx, o.x + o.w], [nx + r.w, o.x], [nx, o.x], [nx + r.w, o.x + o.w]]) if (Math.abs(a - b) < 0.2) { nx += b - a; break; }
          for (const [a, b] of [[nz, o.z + o.d], [nz + r.d, o.z], [nz, o.z], [nz + r.d, o.z + o.d]]) if (Math.abs(a - b) < 0.2) { nz += b - a; break; }
        }
        r.x = nx; r.z = nz;
        g.setAttribute('transform', `translate(${(r.x - ox) * s},${(r.z - oz) * s})`);
      };
      const up = () => { g.removeEventListener('pointermove', mv); g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up); if (moved) { save(); drawPlan(box); } else editRoom(r.id); };
      g.addEventListener('pointermove', mv); g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
    });
  });
}
function editRoom(id) {

  };

/* ---------- import from Roomtape Scanner (Android) ---------- */
function runImport(text) {

  let C = 0, S = 0;

  const groups = {};
  for (const r of rooms) (groups[r.session || 'one'] ||= []).push({ ...r, pts: r.corners.map(rot) });
  const order = Object.values(groups).sort((a, b) => b.length - a.length);
  if (P.example) P = emptyHome();
  let offX = P.rooms.length ? Math.max(...P.rooms.map(r => r.x + r.w)) + 1 : 0;
  const notes = []; let added = 0; const floorsUsed = new Set();
  order.forEach((g, gi) => {
    const all = g.flatMap(r => r.pts), minX = Math.min(...all.map(p => p[0])), minZ = Math.min(...all.map(p => p[1])), maxX = Math.max(...all.map(p => p[0]));
    for (const r of g) {
      const lv = Number.isFinite(+r.level) ? Math.round(+r.level) : 0;
      let f = P.floors.find(x => x.level === lv);
      if (!f) { f = { id: uid(), name: floorName(lv), level: lv }; P.floors.push(f); }
      floorsUsed.add(f.id);
      const xs = r.pts.map(p => p[0] - minX), zs = r.pts.map(p => p[1] - minZ);
      const x0 = Math.min(...xs), z0 = Math.min(...zs);

        w: +(Math.max(...xs) - x0).toFixed(3), d: +(Math.max(...zs) - z0).toFixed(3),
        h: r.height >= 1.8 && r.height <= 6 ? +(+r.height).toFixed(2) : 2.5,
        x: +(offX + x0).toFixed(3), z: +z0.toFixed(3), color: ROOM_COLORS[P.rooms.length % ROOM_COLORS.length],
        poly: r.pts.map(p => [+(p[0] - minX - x0).toFixed(3), +(p[1] - minZ - z0).toFixed(3)]) };
      P.rooms.push(room); added++;
    }
    if (gi > 0 || offX > 0) notes.push(`${g.length} room${g.length > 1 ? 's were' : ' was'} scanned in a separate walk, so I placed ${g.length > 1 ? 'them' : 'it'} beside the others. Drag ${g.length > 1 ? 'them' : 'it'} into place on the floor plan.`);
    offX += (maxX - minX) + 1;
  });
  save(); renderHeader(); setView('plan');
  const el = $('#v-plan');
  const box = document.createElement('div'); box.className = 'status ok';
  box.textContent = `Imported ${added} room${added > 1 ? 's' : ''} on ${floorsUsed.size} floor${floorsUsed.size > 1 ? 's' : ''} from Roomtape Scanner. ${notes.join(' ')}`;
  el.insertBefore(box, el.children[1] || null);
}

    ${Object.entries(byShop).map(([shop, its]) => `<div class="shopgroup"><div class="floorhead"><p class="label">${esc(shop)}</p><span class="num small">${eur(its.reduce((s, i) => s + (i.price || 0), 0))}</span></div>
      ${its.map(i => `<div class="item-line"><div class="n"><div>${esc(i.name)}</div><div class="small muted">${esc((roomOf(i.roomId) || {}).name || '')} · <span class="num">${Math.round(i.w * 100)}×${Math.round(i.d * 100)}×${Math.round(i.h * 100)} cm</span>${i.reference || i.ref ? ' · ref ' + esc(i.reference || i.ref) : ''}</div>
        <div class="small">${i.verified ? `<span class="pill ok">Live price</span> <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(hostOf(i.url))}</a> · checked ${fmtTime(i.checkedAt)}${i.priceNote ? ' · ' + esc(i.priceNote) : ''}` : `<span class="pill">Estimate</span> <a href="https://www.google.com/search?q=${encodeURIComponent((i.shop || '') + ' ' + i.name + ' ' + (i.reference || ''))}" target="_blank" rel="noopener">Search the shop</a>`}
        ${liveState === 'ready' ? ` · <button class="link" data-recheck="${i.id}">Check price now</button>` : ''}</div></div>
        <span class="num">${i.price ? eur(i.price) : '–'}</span></div>`).join('')}</div>`).join('')}
  </div>`;
}
function bindList() {
  const s = $('#see'); if (s) s.onclick = () => setView('3d');
  const u = $('#undoBatch'); if (u) u.onclick = () => { const b = new Set(fState.lastBatch || []); P.items = P.items.filter(i => !b.has(i.id)); fState.lastBatch = null; fState.status = { html: 'Suggestions removed.' }; save(); renderFurnish(); };
  document.querySelectorAll('[data-recheck]').forEach(b => b.onclick = async () => {
    const it = P.items.find(x => x.id === b.dataset.recheck); if (!it || fState.busy) return;
    fState.busy = true; fState.status = { html: `Checking the current price of ${esc(it.name)}…` }; renderFurnish();
    try {
      const r = await liveLookup(`${it.shop} ${it.name} ${it.reference || ''}`.trim(), `shop: ${it.shop}`);
      const old = it.price;
      if (r && r.found) applyLive(it, r); clampItem(it); save();
      fState.status = it.verified ? { kind: 'ok', html: `${esc(it.name)}: ${eur(it.price)}${old && Math.round(old) !== Math.round(it.price) ? ` (was ${eur(old)})` : ''}, read on ${esc(hostOf(it.url))}.` } : { kind: 'err', html: `Could not confirm the price of ${esc(it.name)} in the shop.` };
    } catch (e) { fState.status = { kind: 'err', html: esc(LIVE_ERR[e && e.code] || errMsg(e)) }; }
    fState.busy = false; renderFurnish();
  });
}

renderAll();
})();
</script>
